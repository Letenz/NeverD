name: Native SHA-256 qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/digest.yml'
      - 'cmake/NeverDGoogleTest.cmake'
      - 'include/neverd/support/SHA256.h'
      - 'include/neverd/support/LoadProgress.h'
      - 'lib/support/SHA256*'
      - 'unittests/digest/**'
      - 'unittests/lift/format/InputDigestTests.cpp'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/digest.yml'
      - 'cmake/NeverDGoogleTest.cmake'
      - 'include/neverd/support/SHA256.h'
      - 'include/neverd/support/LoadProgress.h'
      - 'lib/support/SHA256*'
      - 'unittests/digest/**'
      - 'unittests/lift/format/InputDigestTests.cpp'

permissions:
  contents: read

concurrency:
  group: digest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux ARM64 Clang, runner: ubuntu-24.04-arm, cc: clang, cxx: clang++}
          - {name: Linux ARM64 GCC, runner: ubuntu-24.04-arm, cc: gcc, cxx: g++}
          - {name: macOS ARM64, runner: macos-15, cc: clang, cxx: clang++}
          - {name: Windows ARM64 MSVC, runner: windows-11-arm, cc: cl, cxx: cl}
          - {name: Windows ARM64 clang-cl, runner: windows-11-arm, cc: clang-cl, cxx: clang-cl}
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      NEVERD_TEST_SHA256_HARDWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Initialize recorded LLVM fork
        run: git submodule update --init --depth 1 third_party/llvm-project
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: arm64
      - name: Build exact native owners and portable controls
        run: |
          set -euo pipefail
          options=(-DCMAKE_BUILD_TYPE=Release -DNEVERD_DIGEST_REQUIRE_ARM64=ON)
          if [ "$CXX" = clang-cl ]; then
            options+=(-DCMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc
                      -DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc)
          fi
          cmake -S unittests/digest -B build-digest -G Ninja "${options[@]}"
          python scripts/build.py build-digest --target NeverDDigestTests NeverDPortableDigestTests NeverDDigestTestsBench NeverDPortableDigestTestsBench --parallel 3
          git rev-parse HEAD > build-digest/source.txt
          git submodule status third_party/llvm-project > build-digest/llvm-source.txt
      - name: Verify identity, actual dispatch, guarded reads and cancellation
        run: |
          set -euo pipefail
          ctest --test-dir build-digest --output-on-failure --no-tests=error --output-junit tests.xml
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('build-digest/tests.xml').getroot().iter('testcase'))
          assert len(cases) == 16, len(cases)
          assert all(case.get('status') == 'run' for case in cases)
          assert not any(child.tag in {'failure', 'error', 'skipped'} for case in cases for child in case)
          PYTHON
      - name: Measure after all builds and tests finish
        run: |
          set -euo pipefail
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          python unittests/digest/benchmark.py "build-digest/bin/NeverDDigestTestsBench$suffix" "build-digest/bin/NeverDPortableDigestTestsBench$suffix" build-digest/timings.json --require-hardware
      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}-${{ github.sha }}
          path: |
            build-digest/tests.xml
            build-digest/timings.json
            build-digest/source.txt
            build-digest/llvm-source.txt
            build-digest/CMakeCache.txt
            build-digest/compile_commands.json
            build-digest/neverd-*.json
            build-digest/Testing/Temporary/LastTest.log
          if-no-files-found: error
