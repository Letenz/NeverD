name: Native host setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-host-probe.yml'
      - 'scripts/probe_native_host.*'
      - 'scripts/NativeHostProbe.def'
      - 'scripts/tests/test_probe_native_host.py'
      - 'lib/emulation/backends/kvm/KvmProtocol.def'
      - 'lib/emulation/backends/whp/WhpProtocol.def'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/native-host-probe.yml'
      - 'scripts/probe_native_host.*'
      - 'scripts/NativeHostProbe.def'
      - 'scripts/tests/test_probe_native_host.py'
      - 'lib/emulation/backends/kvm/KvmProtocol.def'
      - 'lib/emulation/backends/whp/WhpProtocol.def'

permissions:
  contents: read

concurrency:
  group: native-host-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.backend }} ${{ matrix.arch }} setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: kvm
            arch: X64
            runner: ubuntu-24.04
          - backend: kvm
            arch: ARM64
            runner: ubuntu-24.04-arm
          - backend: whp
            arch: X64
            runner: windows-latest
            msvc: x64
          - backend: whp
            arch: ARM64
            runner: windows-11-arm
            msvc: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Enable native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - name: Verify evidence classification
        run: python -m unittest scripts.tests.test_probe_native_host -v
      - name: Probe actual VM and vCPU setup
        run: >-
          python scripts/probe_native_host.py
          --backend ${{ matrix.backend }} --arch ${{ matrix.arch }}
          --output build-native-host-probe
      - name: Preserve setup and availability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-host-${{ matrix.backend }}-${{ matrix.arch }}
          path: |
            build-native-host-probe/summary.json
            build-native-host-probe/*.stdout
            build-native-host-probe/*.stderr
          if-no-files-found: error
          retention-days: 14
