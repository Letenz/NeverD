name: Native Darwin kernel reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-reference:
    name: macOS kernel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Run the authored workloads against the native kernel
        run: |
          python3 -m unittest scripts.tests.test_run_darwin_kernel_reference -q
          python3 scripts/run_darwin_kernel_reference.py \
          --architecture '${{ matrix.arch }}' --evidence build-kernel-reference
      - name: Preserve native kernel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-kernel-${{ matrix.arch }}
          path: build-kernel-reference/summary.json
          if-no-files-found: warn
