name: Temporary Qt XCB dependency diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcb:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce Desktop GUI dependencies
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.3
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 xvfb xauth openbox xdotool
      - name: Resolve native platform dependencies
        shell: bash
        run: |
          ldd "$RUNNER_TEMP/Qt/6.8.3/gcc_64/plugins/platforms/libqxcb.so"
          ldd "$RUNNER_TEMP/Qt/6.8.3/gcc_64/lib/libQt6XcbQpa.so.6"
