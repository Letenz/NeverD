      - name: Audit the complete owner inventory and required native outcomes
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PYAUDIT'
          from collections import Counter
          import json
          from pathlib import Path
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from scripts.run_native_cpu_ci import hvf_inventory
          from scripts.audit_ci_test_inventory import parse_inventory
          from scripts.audit_ci_test_results import OUTCOME_NAMES, parse_junit
          root = Path("build-hvf/owner-evidence")
          owners, required = hvf_inventory(Path.cwd(), platform.machine())
          expected, actual, cases, errors = set(), set(), [], []
          if {p.name for p in root.iterdir() if p.is_dir()} != set(owners):
              errors.append("owner directories do not match the full native inventory")
          for owner in owners:
              directory = root / owner
              try:
                  if int((directory / "ctest-status.txt").read_text()) != 0:
                      errors.append(owner + ": CTest returned failure")
                  inventory = parse_inventory(json.loads((directory / "inventory.json").read_text()))
                  results = parse_junit(ET.parse(directory / "results.xml").getroot())
                  if not inventory or any(owner not in test.labels for test in inventory):
                      errors.append(owner + ": invalid owner inventory")
                  if len(results) != len(inventory) or set(inventory) != {case.test for case in results}:
                      errors.append(owner + ": test identities do not match")
                  expected.update(inventory)
                  actual.update(case.test for case in results)
                  cases.extend(results)
              except (OSError, ValueError, ET.ParseError) as error:
                  errors.append(owner + ": " + str(error))
          counts = Counter(case.outcome for case in cases)
          passed = {case.test.name for case in cases if case.outcome == "passed"}
          missing = sorted(required - passed)
          summary = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_dirty": bool(subprocess.check_output(["git", "status", "--porcelain"], text=True).strip()),
              "host_architecture": platform.machine(),
              "parallel": 1,
              "execution": "separate CTest invocation for each complete owner",
              "owners": owners,
              "registered": len(expected),
              "total": len(cases),
              "counts": {name: counts[name] for name in OUTCOME_NAMES},
              "required_native_tests": len(required),
              "required_native_unexecuted": missing,
              "errors": errors,
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2), flush=True)
          raise SystemExit(int(bool(errors or missing or expected != actual or
              len(cases) != len(expected) or counts["failed"] or counts["disabled"] or counts["not_run"])))
          PYAUDIT
      - name: Preserve complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hvf-owner-diagnosis-attempt-${{ github.run_attempt }}
